[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-preflight-gate"
version = "0.1.6"
description = "Pre-write preflight gate (bash) and CI authority gate (Python composite action): fail-closed, standard library only except PyYAML for the CI extra."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "alexisromtz-lab" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# HUELLA-PUERTA-FALSA-DEPENDENCIAS-20261106: `dependencies = []` era la misma
# clase de defecto que `packages = []`, un grado mas arriba. El wheel v0.1.5 ya
# traia el codigo, pero `pip install git-preflight-gate` a secas dejaba un CLI
# que moria con RC 30 (NO_MEDIDO) al primer YAML: PyYAML solo viajaba en el
# extra. Es decir, la instruccion de cabecera del README abria una puerta que
# no llevaba a ningun lado — puerta falsa medida, no supuesta. El extra se
# conserva porque nombra la misma dependencia y no rompe instalaciones
# existentes; el default ya la resuelve.
ci-authority-gate = ["PyYAML==6.0.3"]

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/git-preflight-gate"

[project.scripts]
# HUELLA-ENTRYPOINT-CLI-20261106: `main(argv=None)` devuelve el RC del
# instrumento y no lo lanza, asi que el script generado por setuptools
# (`sys.exit(main())`) propaga el veredicto sin envoltorio intermedio.
ci-authority-gate = "sim.gate_workflows_ci:main"

[tool.setuptools]
# HUELLA-PYPROJECT-V012-ALINEADO-20261031: la version del manifiesto sigue al
# tag publicado. Estaba en 0.1.1 mientras el tag era v0.1.2, y el log de
# `pip install` en un runner real lo delata: "Collecting PyYAML==6.0.3 (from
# git-preflight-gate==0.1.1)" con el tag en v0.1.2. Un numero que nombra otra
# cosa es una fila desfasada, no un detalle cosmetico.
# HUELLA-RELEASE-V013-20261031: por la misma razon, cada commit de release sube
# este numero en el mismo acto en que se crea el tag. El arbol del tag nombra su
# propia version; si el tag dijera v0.1.3 y aqui dijera 0.1.2, el ciclo se
# reabriria en el siguiente run.
# HUELLA-PAQUETE-WHEEL-REAL-20261106: REVERSO MEDIDO de `packages = []`.
# El comentario anterior decia "el repositorio no distribuye modulos importables"
# y era cierto: con `packages = []` el wheel de v0.1.3 pesaba 6 768 B y contenia
# SOLO dist-info — cero codigo — y el sdist de 8 920 B omitia preflight-gate.sh,
# action.yml, sim/ y templates/. El extra resolvia PyYAML, pero `pip install`
# no dejaba nada ejecutable: el nombre del paquete nombraba otra cosa que su
# contenido. Se declara el paquete real y un CLI; el action composite sigue
# invocando el instrumento por ruta absoluta y no depende de esta declaracion.
packages = ["sim"]
